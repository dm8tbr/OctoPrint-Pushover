[build-system]
requires = [
    "setuptools>=68",
]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-Pushover"
version = "0.3.8+tbr-004"
description = "Pushes notifications about finished print jobs trough Pushover."
authors = [
    { name = "Thijs Bekke", email = "thijsbekke@gmail.com" },
    { name = "Thomas B. Rücker", email = "octoprint@ruecker.fi" },
]
requires-python = ">=3,<4"
dependencies = [
    "pillow",
]
dynamic = [
    "license",
]

[project.entry-points."octoprint.plugin"]
pushover = "octoprint_pushover"

[project.urls]
Homepage = "https://github.com/dm8tbr/OctoPrint-Pushover"

[project.optional-dependencies]
develop = [
    "go-task-bin",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "octoprint_pushover",
    "octoprint_pushover.*",
]
